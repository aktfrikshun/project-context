name: Chloe canon index

on:
  pull_request:
    paths:
      - "projects/chloekatastrophe/**"
      - "shared/**"
      - "decisions/**"
      - "tools/canon-rag/**"
      - ".github/workflows/chloe-canon-index.yml"
  push:
    branches: [main]
    paths:
      - "projects/chloekatastrophe/**"
      - "shared/**"
      - "decisions/**"
      - "tools/canon-rag/**"
      - ".github/workflows/chloe-canon-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/canon-rag/pyproject.toml
      - name: Install tooling
        run: python -m pip install -e tools/canon-rag pytest
      - name: Validate sources
        run: canon-rag validate
      - name: Test tooling
        run: python -m pytest tools/canon-rag/tests
      - name: Build retrieval artifacts
        env:
          CANON_SOURCE_REVISION: ${{ github.sha }}
        run: canon-rag build
      - name: Upload commit-addressed artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chloe-canon-rag-${{ github.sha }}
          path: generated/chloekatastrophe/
          if-no-files-found: error
          retention-days: 90

